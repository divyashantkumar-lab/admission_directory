<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer orange rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="20" fill="#F97316" />

  <!-- White border -->
  <rect x="15" y="15" width="170" height="170" rx="15" fill="none" stroke="white" stroke-width="2" />

  <!-- Inner content area -->
  <rect x="20" y="20" width="160" height="160" rx="12" fill="#F97316" />

  <!-- "ASIA" text -->
  <text x="100" y="50" font-family="'Montserrat', Arial, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">ASIA</text>

  <!-- "BOOK OF" text -->
  <text x="100" y="85" font-family="'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">BOOK OF</text>

  <!-- "RECORDS" text -->
  <text x="100" y="110" font-family="'Montserrat', Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">RECORDS</text>

  <!-- "AWARDED IN 2025" ribbon/banner at bottom -->
  <rect x="30" y="125" width="140" height="35" rx="5" fill="white" opacity="0.9" />
  <text x="100" y="145" font-family="'Montserrat', Arial, sans-serif" font-size="11" font-weight="700" fill="#F97316" text-anchor="middle">AWARDED IN 2025</text>

  <!-- "Biggest Offline Tech Hackathon in Asia" text at bottom -->
  <text x="100" y="165" font-family="'Montserrat', Arial, sans-serif" font-size="9" font-weight="600" fill="white" text-anchor="middle">Biggest Offline Tech</text>
  <text x="100" y="177" font-family="'Montserrat', Arial, sans-serif" font-size="9" font-weight="600" fill="white" text-anchor="middle">Hackathon in Asia</text>
</svg>
